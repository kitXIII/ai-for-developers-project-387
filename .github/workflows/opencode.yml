name: opencode

# The thread number goes into the run name: `display_title` of a run is not
# rewritten afterwards, so the budget job can find the other runs of the same
# pull request thread by this marker. Issue and pull request numbers share one
# sequence, so the marker is unique across both.
run-name: 'opencode #${{ github.event.issue.number || github.event.pull_request.number }}'

# The agent answers a command in an issue or pull request discussion. Both
# events run the workflow of the default branch with the repository secrets, so
# the budget and the condition of the agent job decide who may start a run.
on:
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  # A queued command must not kill a run that is in the middle of an edit.
  cancel-in-progress: false
  # The default queue keeps a single pending run, so a third command in the same
  # thread would replace the second one silently.
  queue: max

jobs:
  budget:
    name: Budget
    # Only a command of a trusted participant starts a run: bots and users
    # without write access never reach the model. `author_association` is a
    # prefilter only (it does not separate read from write collaborators); the
    # real check is `assertPermissions` inside the action.
    #
    # This job reads the history of this workflow before any checkout and
    # before the App token is issued, so a fork command cannot execute
    # anything here. The condition sits in this job and not in the agent job so
    # that a non-command comment neither counts nor publishes a refusal.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /opencode')) &&
      (github.event.issue.state || github.event.pull_request.state) == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The budget is counted from the run history of this workflow: the API is
      # append-only for a token without `actions: write`, so the hour-long
      # token of the agent (issues: write) cannot reset it by deleting a run or
      # a log, and neither can it re-run one.
      actions: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      spent: ${{ steps.check.outputs.spent }}
      limit: ${{ steps.check.outputs.limit }}
      last_run: ${{ steps.check.outputs.last_run }}
    steps:
      # An issue thread is not limited. A pull request thread counts attempts
      # in which the agent job of `opencode.yml` really started: `run_attempt`
      # of a run covers Re-runs, and `steps` of the `Agent` job separates a
      # started job from `skipped`, `action_required`, `startup_failure`,
      # `stale` and a budget refusal. Cancellations and timeouts count, because
      # the model had already been called. The current run is excluded: it is
      # already in the list when the check runs.
      #
      # The unit is the `Agent` job name below: renaming that job must be
      # mirrored in the jq filter, otherwise no attempt is counted. Runs made
      # before `run-name` existed carry the thread title instead of the marker
      # and are not counted, so the budget starts with this deploy (status:
      # accepted, docs/adr/0007-pr-run-budget-from-actions-history.md).
      - name: Count allowed attempts
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          THREAD: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' }}
        run: |
          set -euo pipefail

          limit=3
          spent=0
          last_run=""

          if [ "$IS_PR" != "true" ]; then
            echo "thread #${THREAD} is an issue: the budget does not apply"
            {
              echo "allowed=true"
              echo "spent=0"
              echo "limit=${limit}"
              echo "last_run="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          marker="opencode #${THREAD}"
          page=1
          while :; do
            body=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/opencode.yml/runs?per_page=100&page=${page}")
            page_runs=$(jq '.workflow_runs | length' <<<"$body")
            while IFS=$'\t' read -r id attempts url; do
              [ -n "$id" ] || continue
              # `attempts/{n}/jobs` is the only way to see every attempt: the
              # run list returns one entry per run with the last attempt number.
              for n in $(seq 1 "$attempts"); do
                jobs=$(gh api \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/attempts/${n}/jobs?per_page=100")
                ran=$(jq '[.jobs[] | select(.name == "Agent") | select((.steps | length) > 0)] | length' <<<"$jobs")
                spent=$((spent + ran))
                if [ "$ran" -gt 0 ] && [ -z "$last_run" ]; then
                  last_run=$url
                fi
              done
            done < <(jq -r --arg marker "$marker" --argjson self "$GITHUB_RUN_ID" '
                .workflow_runs[]
                | select(.display_title == $marker and .id != $self)
                | select((.conclusion // "running")
                         | IN("skipped", "action_required", "startup_failure", "stale") | not)
                | [.id, .run_attempt, .html_url] | @tsv' <<<"$body")
            if [ "$page_runs" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          allowed=false
          if [ "$spent" -lt "$limit" ]; then
            allowed=true
          fi
          echo "thread #${THREAD}: ${spent} of ${limit} allowed attempts spent"
          {
            echo "allowed=${allowed}"
            echo "spent=${spent}"
            echo "limit=${limit}"
            echo "last_run=${last_run}"
          } >> "$GITHUB_OUTPUT"

  opencode:
    name: Agent
    needs: budget
    # A refusal (allowed == false) ends the run here: no checkout, no App
    # token, no model. The Budget job above already checked that the comment is
    # a command of a trusted participant.
    if: needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Exchanged for the token of the opencode GitHub App: comments, branches
      # and pull requests. See README.md, "Агент в GitHub Actions".
      id-token: write
      # The fork guard reads the pull request of this repository only.
      pull-requests: read
    steps:
      # The action checks out the branch of a fork pull request and runs the
      # agent on it while the App token (contents and pull requests: write)
      # sits in `.git/config`, so a fork command would execute untrusted code
      # next to a write token.
      - name: Reject fork pull requests
        if: github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=${{ github.event.issue.number || github.event.pull_request.number }}
          fork=$(gh api "repos/${{ github.repository }}/pulls/${number}" --jq .head.repo.fork)
          [ "$fork" = "false" ] || {
            echo "::error::/oc in a pull request from a fork is not supported"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # Not `mise run setup`: it also installs the hk Git hooks, and then every
      # commit of the agent runs the whole pre-push gate. The agent gets the
      # project commands instead: `mise run lint`, `typecheck`, `test`.
      - run: pnpm install --frozen-lockfile
      # The opencode App token stays inside opencode (its API client and the
      # repository git config), so `gh` in the shell of the agent would be
      # unauthenticated. This second App supplies an hour-long token with
      # `issues: write` only, so the agent can work with the issue tracker.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: tracker
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          # The App itself is created with `Issues: Read and write` only.
          permission-issues: write
      # The upstream `anomalyco/opencode/github` action is not used: its version
      # step calls the unauthenticated GitHub API, and a rate limit fails the
      # run before opencode starts. The local action installs the pinned V1
      # release directly and runs the same `opencode github run` entrypoint.
      - uses: ./.github/actions/opencode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ steps.tracker.outputs.token }}
          # The pinned V1 release accepts only V1 `permission` rules: V2
          # `permissions` fails config validation. The checkout is the only
          # tree the agent may touch; a read, edit, search or `cd` outside it
          # is denied.
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":"deny"}}'
        with:
          model: opencode/deepseek-v4.1-flash

  refuse:
    name: Refusal
    needs: [budget, opencode]
    # The refusal is published only after a successful count: a broken counter
    # is a red Budget job, not a fake `limit_exhausted`. A skipped `Agent` job
    # (the normal case here) never makes the workflow red.
    if: |
      always() &&
      needs.budget.result == 'success' &&
      needs.budget.outputs.allowed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # One comment in the thread. `issues: write` covers the conversation of
      # an issue and of a pull request; neither the checkout nor the App token
      # nor the model is involved in this job.
      issues: write
    steps:
      - name: Publish limit_exhausted
        env:
          GH_TOKEN: ${{ github.token }}
          THREAD: ${{ github.event.issue.number || github.event.pull_request.number }}
          SPENT: ${{ needs.budget.outputs.spent }}
          LIMIT: ${{ needs.budget.outputs.limit }}
          LAST_RUN: ${{ needs.budget.outputs.last_run }}
        run: |
          set -euo pipefail

          last=${LAST_RUN:-https://github.com/${GITHUB_REPOSITORY}/actions/workflows/opencode.yml}
          body=$(printf '%s\n' \
            '**limit_exhausted** — исчерпан бюджет запусков агента в этом PR-треде.' \
            '' \
            "- Допущено команд: ${LIMIT}" \
            "- Потрачено: ${SPENT}" \
            "- Последний прогон: ${last}" \
            '' \
            'Модель по этой команде не запускалась. Бюджет считается по истории Actions' \
            '(попытки, в которых job агента действительно стартовал) и не сбрасывается' \
            'комментарием или агентом; новые команды в треде получат такой же отказ.')
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${THREAD}/comments" \
            --field body="$body"
