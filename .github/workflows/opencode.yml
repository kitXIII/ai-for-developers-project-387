name: opencode

# The agent answers a command in an issue or pull request discussion. Both
# events run the workflow of the default branch with the repository secrets, so
# the job condition below decides who may start a run.
on:
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  # A queued command must not kill a run that is in the middle of an edit.
  cancel-in-progress: false
  # The default queue keeps a single pending run, so a third command in the same
  # thread would replace the second one silently.
  queue: max

jobs:
  opencode:
    name: Agent
    # Only a command of a trusted participant starts a run: bots and users
    # without write access never reach the model. `author_association` is a
    # prefilter only (it does not separate read from write collaborators); the
    # real check is `assertPermissions` inside the action.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /opencode')) &&
      (github.event.issue.state || github.event.pull_request.state) == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Exchanged for the token of the opencode GitHub App: comments, branches
      # and pull requests. See README.md, "Агент в GitHub Actions".
      id-token: write
      # The fork guard reads the pull request of this repository only.
      pull-requests: read
    steps:
      # The action checks out the branch of a fork pull request and runs the
      # agent on it while the App token (contents and pull requests: write)
      # sits in `.git/config`, so a fork command would execute untrusted code
      # next to a write token.
      - name: Reject fork pull requests
        if: github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=${{ github.event.issue.number || github.event.pull_request.number }}
          fork=$(gh api "repos/${{ github.repository }}/pulls/${number}" --jq .head.repo.fork)
          [ "$fork" = "false" ] || {
            echo "::error::/oc in a pull request from a fork is not supported"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # Not `mise run setup`: it also installs the hk Git hooks, and then every
      # commit of the agent runs the whole pre-push gate. The agent gets the
      # project commands instead: `mise run lint`, `typecheck`, `test`.
      - run: pnpm install --frozen-lockfile
      # The opencode App token stays inside opencode (its API client and the
      # repository git config), so `gh` in the shell of the agent would be
      # unauthenticated. This second App supplies an hour-long token with
      # `issues: write` only, so the agent can work with the issue tracker.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: tracker
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          # The App itself is created with `Issues: Read and write` only.
          permission-issues: write
      - uses: anomalyco/opencode/github@f4e363c8295fa90a03dddc451882fffe8fbce357 # v1.19.6
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ steps.tracker.outputs.token }}
          # The action installs OpenCode V1.19.6 from `releases/latest`, so the
          # inline config uses V1 `permission`: V2 `permissions` fails config
          # validation and the run dies before the agent starts. The checkout
          # is the only tree the agent may touch; a read, edit, search or `cd`
          # outside it is denied.
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":"deny"}}'
        with:
          model: opencode/deepseek-v4.1-flash
