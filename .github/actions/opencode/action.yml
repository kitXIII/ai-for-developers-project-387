name: opencode
description: Install a pinned OpenCode V1 and run the GitHub agent

# The upstream `anomalyco/opencode/github` action resolves its binary through
# an unauthenticated call to `releases/latest`; a rate limit or a transient API
# error fails the whole run before opencode starts, and the action is removed
# from upstream. This wrapper installs a pinned V1 release from the public
# download URL instead and runs the same `opencode github run` entrypoint.
#
# The version is pinned because the inline config in the workflows uses V1
# `permission` rules; V2 rejects them.

inputs:
  version:
    description: OpenCode version to install
    required: false
    default: '1.19.6'
  model:
    description: Model in provider/model form
    required: true
  prompt:
    description: Prompt for events that have no comment to read
    required: false
    default: ''
  agent:
    description: Primary agent to use
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install opencode
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.opencode/bin"
        curl -fsSL \
          "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/opencode-linux-x64.tar.gz" \
          -o "$RUNNER_TEMP/opencode.tar.gz"
        tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP"
        install -m 0755 "$RUNNER_TEMP/opencode" "$HOME/.opencode/bin/opencode"
    - name: Add opencode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
    - name: Run opencode
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        PROMPT: ${{ inputs.prompt }}
      run: opencode github run
